<!DOCTYPE html>
<html>
    <head>
        <title>Guide Pharmacy</title>
        <meta charset="UTF-8">

        <style>
            :root
            {
                --primary-color:rgb(4,6,46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }

            *
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }

            body
            {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                width: auto;
                height: 100vh;
            }

            div
            {
                width: 50%;
            }

            #left
            {
                background-color: var(--primary-color);
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
            }

            #right
            {
                background-color: var(--secondary-color);
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
            }

            .heading
            {
                color: var(--secondary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                text-align: left;
                font-size: 50px;
            }

            h1
            {
                color: var(--primary-color);
                font-size: 50px;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }

            label
            {
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 15px;
            }

            input
            {
                padding: 15px;
                
                border: solid var(--primary-color) 1px;
                width: 270px;
                background-color: var(--secondary-color);
            }
            input:active
            {
                border: none;
            }
            
            button
            {
                background-color: var(--primary-color);
                color: var(--secondary-color);
                padding: 12px;
                margin-top: 30px;
                width: 90px;
                cursor: pointer;
                border-radius: 5px;
                transition: all 0.5s;
            }
            button:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }

            p
            {
                color:var(--third-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }

        </style>
    </head>
    <body>
        <div id="left">
            <h1 class="heading">Welcome to,</h1>
            <h1 class="heading">Guide Pharmacy ➕</h1>
        </div>

        <div id="right">
            <div id="one"><h1>Login</h1></div>
            <div><p>You must login to the system for accessing services</p></div>
            <div id="two"><label>Enter Username / email</label></div>
            <div id="three"><input type="text" id="username"></div>
            <div id="four"><label>Enter Password</label></div>
            <div id="five"><input type="password" id="password"></div>
            <div id="six"><button onclick="return checkLogin()">Login</button></div>
        </div>

        <script>
            function checkLogin() {
            const user = document.getElementById("username").value;
            const pwd = document.getElementById("password").value;

            // Hardcoded credentials
            if (user === "himas@guide2026" && pwd === "hG2026pharm") {
                window.location.href = "SecondPage.html"; // go to next page

            } else {
                alert("Invalid login");
                return false;
            }
            }
</script>

    </body>
</html>
