<!DOCTYPE html>
<html>
    <head>
        <title>Alerts | Guide pharmacy</title>
        <meta charset="UTF-8">

        <style>
            :root
            {
                --primary-color:rgb(4, 6, 46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }
            *,body
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }
            body
            {
                
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                height: 100%;
            }
            
            #sidebar
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                text-decoration: none;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 30px;
                width: 20%;
                height: 100vh;
                justify-content:space-around;
                gap: 10px;
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: var(--primary-color);
                border-right: solid var(--secondary-color) 1px;
            }
            a
            {
                text-decoration: none;
                color: var(--secondary-color);
                text-align: center;
                padding-bottom: 15px;
                padding-top: 15px;
                font-size: 15px;
                transition: all 0.5s;
            }
            a:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }

            
            
            p
            {
                font-size: 30px;
                font-weight: 600;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 20px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--secondary-color);
            }
            span
            {
                font-size: 10px;
                font-weight: 200;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 5px;
                margin-bottom: 20px;
            }

            #alerts-container
            {
                background-color: var(--secondary-color);
                width: 100%;
                margin-top: 20px;
                margin-bottom:20px;
                
                height: 70%;
                overflow-y: auto;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                
            }

            .alert-card
            {
                height: 150px;
                border: 1px solid black;
                margin: 5px;
                width: 24%;
                text-align: center;
                align-content: center;
                background-color: var(--primary-color);
            }

            h2,h3,h4
            {
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                color: var(--secondary-color);
                font-weight: 200;
            }

            #side
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                width: 80%;
                height: 100vh;
            }
            h1
            {
                margin-top: 10px;
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                text-align: center;
            }
            #one
            {
                width: 100%;
                height: 10%;

            }
            #two
            {
                width: 100%;
                height: 10%;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 15px;
            }
            .alertb
            {
                padding: 12px 32px;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                border: var(--secondary-color) 0.5px solid;
                border-radius: 10px;
            }

            #orange
            {
                background-color: orange;
                transition: all 0.5s;
            }
            #orange:hover
            {
                background-color: var(--secondary-color);
                color: orange;
                border-color: orange;
            }


            #red
            {
                background-color: red;
                transition: all 0.5s;
            }
            #red:hover
            {
                background-color: var(--secondary-color);
                color: red;
                border-color: red;
            }


            #yellow
            {
                background-color: yellow;
                transition: all 0.5s;
            }
            #yellow:hover
            {
                background-color: var(--secondary-color);
                color: yellow;
                border-color: yellow;
            }

            
        </style>
    </head>
    <body>
        
        <nav id="sidebar">
            <p>Guide Pharmacy <br> <span>🧑‍⚕️ Hello ,user !</span></p>
            <a href="sell.html">🏷️ Sell</a>
            <a href="buy.html">🛒 Buy</a>
            <a href="suppliers.html">🚚 Suppliers</a>
            <a href="stock.html">📦 Stock</a>
            <a href="sales.html">📈 Sales</a>
            <a href="purchase.html">💳 Purchase</a>
            <a href="alerts.html">🚨 Alerts</a>
            <a href="SecondPage.html">⚡ Quick Access Panel</a>
            <a href="#" onclick="logout()">Logout ↩️</a>
        </nav>

        <div id="side">
            <div id="one"><h1>Alerts 🚨</h1></div>
            <div id="two">
                <button class="alertb" id="orange">All alerts</button>
                <button class="alertb" id="red">Expiry alerts</button>
                <button class="alertb" id="yellow">Low stock</button>
            </div>
            <div id="alerts-container">
            
            </div>
        </div>

        <script>
            function logout() {
            // Clear any stored login info (if you used localStorage/sessionStorage)
            sessionStorage.clear();
            localStorage.clear();

            // Redirect back to login page
            window.location.href = "phar_main.html";
            }

            window.onload = function() {
            fetch("https://pharmacy-software-kdbi.onrender.com/alerts/data")
                .then(res => res.json())   // get JSON instead of text
                .then(alerts => {
                let container = document.getElementById("alerts-container");
                if (alerts.length === 0) {
                    container.innerHTML = "<p>✅ No alerts today</p>";
                } else {
                    // Build divs dynamically
                    container.innerHTML = alerts.map(alert =>
                    `<div class="alert-card">
                        <h3>${alert.name}</h3>
                        <h3>${alert.message}</h3>
                        <h4>ID: ${alert.product_id}</h4>
                        <h4>${alert.sup_id}</h4>
                    </div>`
                    ).join("");
                }
                });
            };




            // Event listeners
            document.getElementById("yellow").addEventListener("click", () => {
                fetch("https://pharmacy-software-kdbi.onrender.com/alertsc?type=low")
                .then(res => res.json())
                .then(alertsc => renderAlerts(alertsc));
            });

            document.getElementById("red").addEventListener("click", () => {
                fetch("https://pharmacy-software-kdbi.onrender.com/alertsc?type=expiry")
                .then(res => res.json())
                .then(alertsc => renderAlerts(alertsc));
            });

            document.getElementById("orange").addEventListener("click", () => {
                fetch("https://pharmacy-software-kdbi.onrender.com/alertsc?type=all")
                .then(res => res.json())
                .then(alertsc => renderAlerts(alertsc));
            });

            // Render helper
            function renderAlerts(alertsc) {
                let container = document.getElementById("alerts-container");
                if (alertsc.length === 0) {
                container.innerHTML = "<p>✅ No alerts</p>";
                } else {
                container.innerHTML = alertsc.map(a =>
                    `<div class="alert-card" style="border:1px solid red;">
                    <h3>${a.name}</h3>
                    <h3>${a.message}</h3>
                    <h4>ID: ${a.product_id}</h4>
                    <h4>${a.sup_id}</h4>
                    </div>`
                ).join("");
                }
            }



        </script>

    </body>
</html>
