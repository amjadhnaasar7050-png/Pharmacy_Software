<!DOCTYPE html>
<html>
<head>
    <title>Sales | Guide Pharmacy</title>
    <meta charset="UTF-8">
    <style>
            :root
            {
                --primary-color:rgb(4, 6, 46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }
            *,body
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }
            body
            {
                
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            #sidebar
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                text-decoration: none;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 30px;
                width: 20%;
                height: 100vh;
                justify-content:space-around;
                gap: 10px;
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: var(--primary-color);
                border-right: solid var(--secondary-color) 1px;
            }
            a
            {
                text-decoration: none;
                color: var(--secondary-color);
                text-align: center;
                padding-bottom: 15px;
                padding-top: 15px;
                font-size: 15px;
                transition: all 0.5s;
            }
            a:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }
            p
            {
                font-size: 30px;
                font-weight: 600;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 20px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--secondary-color);
            }
            span
            {
                font-size: 10px;
                font-weight: 200;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 5px;
                margin-bottom: 20px;
            }
            #dash
            {
                background-color: var(--secondary-color);
                width: 80%;
                height: 100vh;
                padding-top: 40px;
                padding-left: 40px;
                padding-right: 40px;
                padding-bottom: 40px;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                overflow-y: auto;
            }
            #salesTable
            {
                flex: 1;
                width: 100%;
                height: 100%;
                border: 1px solid black;
                border-collapse: collapse;
            }
            th
            {
                border: 1px solid black;
                height: 30px;
            }
            tr,td
            {
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                text-align: center;   
            }

    </style>
</head>
<body>
    <nav id="sidebar">
            <p>Guide Pharmacy <br> <span>🧑‍⚕️ Hello ,user !</span></p>
            <a href="sell.html">🏷️ Sell</a>
            <a href="buy.html">🛒 Buy</a>
            <a href="suppliers.html">🚚 Suppliers</a>
            <a href="stock.html">📦 Stock</a>
            <a href="sales.html">📈 Sales</a>
            <a href="purchase.html">💳 Purchase</a>
            <a href="alerts.html">🚨 Alerts</a>
            <a href="SecondPage.html">⚡ Quick Access Panel</a>
            <a href="#" onclick="logout()">Logout ↩️</a>
        </nav>
        <div id="dash">
            <table id="salesTable">
                <tr><th>Sales ID</th><th>Name</th><th>Date</th><th>Amount</th><th>Transaction M</th></tr>
                
            </table>
        </div>

        <script>
            function logout() {
            // Clear any stored login info (if you used localStorage/sessionStorage)
            sessionStorage.clear();
            localStorage.clear();

            // Redirect back to login page
            window.location.href = "phar_main.html";
            }

             async function loadSales() {
            const response = await fetch("https://pharmacy-software-kdbi.onrender.com/sales");
            const products = await response.json();

            let table = document.getElementById("salesTable");
            products.forEach(p => {
                let row = `<tr><td>${p.sales_id}</td><td>${p.name}</td><td>${p.date}</td><td>${p.amount_sales}</td><td>${p.payment_s}</td></tr>`;
                table.innerHTML += row;
            });
            }
            window.onload = loadSales;
</script>
</body>
</html>
