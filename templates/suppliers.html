<!DOCTYPE html>
<html>
    <head>
        <title>Suppliers | x</title>
        <meta charset="UTF-8">

        <style>
            :root
            {
                --primary-color:rgb(4, 6, 46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }
            *,body
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }
            body
            {
                
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            #sidebar
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                text-decoration: none;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 30px;
                width: 20%;
                height: 100vh;
                justify-content:space-around;
                gap: 10px;
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: var(--primary-color);
                border-right: solid var(--secondary-color) 1px;
            }
            a
            {
                text-decoration: none;
                color: var(--secondary-color);
                text-align: center;
                padding-bottom: 15px;
                padding-top: 15px;
                font-size: 15px;
                transition: all 0.5s;
            }
            a:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }

            
            
            p
            {
                font-size: 30px;
                font-weight: 600;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 20px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--secondary-color);
            }
            span
            {
                font-size: 10px;
                font-weight: 200;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 5px;
                margin-bottom: 20px;
            }

            #side
            {
                display:flex ;
                flex-direction:column ;
                flex-wrap: wrap;
                width: 80%;
                height: 100vh; 
                overflow-y: auto;    
                overflow-x: hidden;
                padding: 20px 0px;
            }

            #crud
            {
                padding: 20px;
                width: 100%;
                height: 55%;
                overflow-y:auto;
            }

            #dash
            {
                padding: 20px;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items: center;
                width: 100%;
                height: 40%;        
                overflow-y: auto;    
                overflow-x: hidden;
            }

            th
            {
                width: 300px;
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                text-align: center;
            }

            #stockTable
            {
                height: 100%;
                border-collapse: collapse; /*to learn */
                background-color: var(--secondary-color);
                padding: 10px 15px;
                border: 1px solid var(--primary-color);
            }
            tr
            {
                text-align: center;
            }
            td
            {
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }
            .form
            {
                margin: 5px;
                height: 30px;
                width: 200px;
                border: 1.5px solid var(--primary-color);
                padding: 5px;
            }
            fieldset
            {
                padding: 20px;
                border-radius: 25px;
                border: 2px solid var(--primary-color);
            }
            legend
            {
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 15px;
            }
            button
            {
                margin: 10px 10px 10px 5px;
                padding: 12px 32px;
                color: var(--secondary-color);
                background-color: var(--primary-color);
                border-radius: 5px;
            }
            form
            {
                margin-bottom: 10px;
            }

            
        </style>
    </head>
    <body>
        
        <nav id="sidebar">
            <p>X Pharmacy <br> <span>🧑‍⚕️ Hello ,user !</span></p>
            <a href="sell.html">🏷️ Sell</a>
            <a href="buy.html">🛒 Buy</a>
            <a href="suppliers.html">🚚 Suppliers</a>
            <a href="stock.html">📦 Stock</a>
            <a href="sales.html">📈 Sales</a>
            <a href="purchase.html">💳 Purchase</a>
            <a href="alerts.html">🚨 Alerts</a>
            <a href="SecondPage.html">⚡ Quick Access Panel</a>
            <a href="#" onclick="logout()">Logout ↩️</a>
        </nav>

        <div id="side">
            <div id="crud">
                <form action="https://pharmacy-software-kdbi.onrender.com/add_supplier" method="post">
                    <fieldset>
                        <legend>Add Supplier</legend>
                        <input type="text" name="sup_id" placeholder="Enter Supplier ID" class="form" required>
                        <br>
                        <input type="text" name="name" placeholder="Name" class="form" required>
                        <br>
                        <input type="text" name="contact_no" placeholder="Contact No" class="form" required>
                        <br>
                        <input type="text" name="origin" placeholder="Origin" class="form" required>
                        <br>
                        <input type="email" name="email" placeholder="Enter email address" class="form" required>
                        <br>
                        <button type="submit">Add Supplier</button>
                        <br>
                        
                        
                    </fieldset>
                </form>
                <form action="https://pharmacy-software-kdbi.onrender.com/delete_supplier" method="post">
                    <fieldset>
                        <legend>Remove Supplier</legend>
                        <input type="text" name="sup_id" placeholder="Enter Supplier ID" class="form" required>
                        <br>
                        <button type="submit">Remove Supplier</button>
                    </fieldset>
                </form>
            </div>
            <hr>
            <div id="dash">
                <table id="stockTable" border="1">
                    <tr><th>Supplier ID</th><th>Name</th><th>Contact No</th><th>Origin</th><th>Email</th></tr>
                </table>
            </div>

        </div>
        

        <script>
            function logout() {
            // Clear any stored login info (if you used localStorage/sessionStorage)
            sessionStorage.clear();
            localStorage.clear();

            // Redirect back to login page
            window.location.href = "phar_main.html";
            }

            async function loadSuppliers() {
            const response1 = await fetch("https://pharmacy-software-kdbi.onrender.com/suppliers");
            const suppliers = await response1.json();

            let table = document.getElementById("stockTable");
            suppliers.forEach(p => {
                let row = `<tr><td>${p.sup_id}</td><td>${p.name}</td><td>${p.contact_no}</td><td>${p.origin}</td><td>${p.email}</td></tr>`;
                table.innerHTML += row;
            });
            }
            window.onload = loadSuppliers; // auto-load on page open

        </script>

    </body>
</html>
