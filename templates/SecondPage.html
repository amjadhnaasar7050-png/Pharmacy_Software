<!DOCTYPE html>
<html>
    <head>
        <title>Main Page | Guide Pharmacy</title>
        <meta charset="UTF-8">

        <style>
            :root
            {
                --primary-color:rgb(4, 6, 46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }
            *,body
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }
            body
            {
                
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            #sidebar
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                text-decoration: none;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 30px;
                width: 20%;
                height: 100vh;
                justify-content:space-around;
                gap: 10px;
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: var(--primary-color);
                border-right: solid var(--secondary-color) 1px;
            }
            a
            {
                text-decoration: none;
                color: var(--secondary-color);
                text-align: center;
                padding-bottom: 15px;
                padding-top: 15px;
                font-size: 15px;
                transition: all 0.5s;
            }
            a:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }

            #dash
            {
                background-color: var(--secondary-color);
                width: 80%;
                padding-top: 40px;
                padding-left: 40px;
                padding-right: 40px;
                padding-bottom: 200px;
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content:left;
                align-items: center;
            }

            .element
            {
                width: 300px;
                height: 180px;
                margin: 2px 10px;
                padding: 15px;
                align-content: center;
                justify-content: center;
                text-align: center;
                background-color: var(--primary-color);
                color: var(--secondary-color);
                font-size: 20px;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.5s;
            }
            .element:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
                border-color: var(--primary-color);
            }
            #main
            {
                color: var(--primary-color);
                font-size: 40px;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                width: 100%;
                margin-bottom: 20px;
                border-bottom: 2px solid var(--primary-color);
                font-weight: 700;
            }
            
            p
            {
                font-size: 30px;
                font-weight: 600;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 20px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--secondary-color);
            }
            span
            {
                font-size: 10px;
                font-weight: 200;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 5px;
                margin-bottom: 20px;
            }

            
        </style>
    </head>
    <body>
        
        <nav id="sidebar">
            <p>Guide Pharmacy <br> <span>🧑‍⚕️ Hello ,user !</span></p>
            <a href="sell.html">🏷️ Sell</a>
            <a href="buy.html">🛒 Buy</a>
            <a href="suppliers.html">🚚 Suppliers</a>
            <a href="stock.html">📦 Stock</a>
            <a href="sales.html">📈 Sales</a>
            <a href="purchase.html">💳 Purchase</a>
            <a href="alerts.html">🚨 Alerts</a>
            <a href="SecondPage.html">⚡ Quick Access Panel</a>
            <a href="#" onclick="logout()">Logout ↩️</a>
        </nav>
        <div id="dash">
            <div id="main">⚡Quick Access Panel <br></div>
            <div class="element">Total Sales 📈 <br> 0</div>
            <div class="element">Purchase 💳 <br> 0</div>
            <div class="element">Transactions 💰 <br> 0</div>
            <div class="element">Alerts ⚠️ <br>0 </div>
            <div class="element">Suppliers 🚚<br>0 </div>
        </div>

        <script>
            function logout() {
            // Clear any stored login info (if you used localStorage/sessionStorage)
            sessionStorage.clear();
            localStorage.clear();

            // Redirect back to login page
            window.location.href = "phar_main.html";
            }
</script>

    </body>
</html>
