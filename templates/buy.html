<!DOCTYPE html>
<html>
<head>
    <title>Buy | Guide Pharmacy</title>
    <meta charset="UTF-8">
    <style>
            :root
            {
                --primary-color:rgb(4, 6, 46);
                --secondary-color:rgb(255, 255, 255);
                --third-color:rgba(14, 15, 15, 0.232);
            }
            *,body
            {
                margin: 0px;
                padding: 0px;
                overflow-x: hidden;
                box-sizing: border-box;
                overflow-y: hidden;
            }
            body
            {
                
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            #sidebar
            {
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                text-decoration: none;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 30px;
                width: 20%;
                height: 100vh;
                justify-content:space-around;
                gap: 10px;
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: var(--primary-color);
                border-right: solid var(--secondary-color) 1px;
            }
            a
            {
                text-decoration: none;
                color: var(--secondary-color);
                text-align: center;
                padding-bottom: 15px;
                padding-top: 15px;
                font-size: 15px;
                transition: all 0.5s;
            }
            a:hover
            {
                background-color: var(--secondary-color);
                color: var(--primary-color);
            }

            
            p
            {
                font-size: 30px;
                font-weight: 600;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 20px;
                margin-bottom: 10px;
                border-bottom: 2px solid var(--secondary-color);
            }
            span
            {
                font-size: 10px;
                font-weight: 200;
                color: var(--secondary-color);
                text-align: center;
                margin-top: 5px;
                margin-bottom: 20px;
            }

            

            #crud
            {
                padding: 10px;
                width: 70%;
                height: 100%;
                overflow-y:auto;
            }
            #dash
            {
                padding: 20px;
                display: flex;
                flex-direction: column;
                flex-wrap: wrap;
                align-items:flex-start;
                width: 80%;
                height: 100vh;        
                overflow-y: auto;    
                overflow-x: hidden;
            }
            .form
            {
                margin: 5px;
                height: 30px;
                width: 200px;
                border: 1.5px solid var(--primary-color);
                padding: 5px;
            }
            fieldset
            {
                padding: 20px;
                border-radius: 25px;
                border: 2px solid var(--primary-color);
            }
            legend
            {
                color: var(--primary-color);
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                font-size: 15px;
            }
            button
            {
                margin: 10px 10px 10px 5px;
                padding: 12px 32px;
                color: var(--secondary-color);
                background-color: var(--primary-color);
                border-radius: 5px;
            }
            form
            {
                margin-bottom: 10px;
            }

            
    </style>
</head>
<body>
    <nav id="sidebar">
            <p>Guide Pharmacy <br> <span>🧑‍⚕️ Hello ,user !</span></p>
            <a href="sell.html">🏷️ Sell</a>
            <a href="buy.html">🛒 Buy</a>
            <a href="suppliers.html">🚚 Suppliers</a>
            <a href="stock.html">📦 Stock</a>
            <a href="sales.html">📈 Sales</a>
            <a href="purchase.html">💳 Purchase</a>
            <a href="alerts.html">🚨 Alerts</a>
            <a href="SecondPage.html">⚡ Quick Access Panel</a>
            <a href="#" onclick="logout()">Logout ↩️</a>
        </nav>
        <div id="dash">
            <div id="crud">
                <form action="/add_buy" method="post">
                    <fieldset>
                        <legend>Add purchase</legend>
                        <input type="text" name="purchase" placeholder="Purchase ID" class="form" required>
                        <br>
                        <input type="text" name="name"  placeholder="Supplier name" class="form" required>
                        <br>
                        <input type="date" name="date" placeholder="Date" class="form" required>
                        <br>
                        <input type="number" name="amount" step="0.01" placeholder="Amount" class="form" required>
                        <br>
                        <input type="text" name="method" placeholder="Cash / Credit" class="form" required>
                        <br>
                        <button type="submit">Add Purchase</button>
                        <br>
                        
                        
                    </fieldset>
                </form>
                <form action="/delete_purchase" method="post">
                    <fieldset>
                        <legend>Remove purchase</legend>
                        <input type="text" name="purchase_id" placeholder="Enter purchase ID" class="form" required>
                        <br>
                        <button type="submit">Remove Purchase</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <script>
            function logout() {
            // Clear any stored login info (if you used localStorage/sessionStorage)
            sessionStorage.clear();
            localStorage.clear();

            // Redirect back to login page
            window.location.href = "phar_main.html";
            }
</script>
</body>
</html>
